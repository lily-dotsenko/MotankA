<section class="products section" id="products">
  <div class="container">
    <!-- Section Header -->
    <div class="section__header">
      <h2 class="section__title fade-in-up" data-i18n="products.title">
        Our Collection
      </h2>
      <div class="section__divider"></div>
      <p class="section__subtitle fade-in-up" data-i18n="products.subtitle">
        Each Motanka is handcrafted with natural materials, carrying centuries
        of Ukrainian tradition and spiritual meaning.
      </p>
    </div>

    <!-- Products Grid — rendered dynamically by products.js -->
    <div class="products__grid" id="productsGrid">
      <!-- Product cards will be injected here -->
    </div>

    <!-- Admin: Add Product button (shown only for admin) -->
    <button class="products__add-btn" id="addProductBtn" data-i18n="admin.addProduct">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Motanka
    </button>
  </div>
</section>
